using System.Text.Json;

namespace QuizApp;

class User { public string Login { get; set; } = ""; public string Password { get; set; } = ""; public DateOnly BirthDate { get; set; } }
class Quiz { public string Name { get; set; } = ""; public List<Question> Questions { get; set; } = new(); }
class Question { public string Text { get; set; } = ""; public List<string> Options { get; set; } = new(); public HashSet<int> CorrectAnswers { get; set; } = new(); }
class QuizResult { public string Username { get; set; } = ""; public string QuizName { get; set; } = ""; public int Score { get; set; } public int Total { get; set; } public DateTime Date { get; set; } }

class Program
{
    static string DataFolder = "Data", UsersFile = "Data/users.json", QuizzesFolder = "Data/quizzes", ResultsFolder = "Data/results";
    static User? currentUser = null;

    static void Main()
    {
        Console.OutputEncoding = System.Text.Encoding.UTF8;
        foreach (var f in new[] { DataFolder, QuizzesFolder, ResultsFolder }) if (!Directory.Exists(f)) Directory.CreateDirectory(f);

        var users = LoadUsers();
        if (users.Count == 0) { users.Add(new User { Login = "admin", Password = "admin", BirthDate = DateOnly.Parse("2000-01-01") }); SaveUsers(users); Console.WriteLine("Создан admin (пароль: admin)\nНажмите Enter..."); Console.ReadLine(); }

        while (currentUser == null) ShowAuthMenu();
        while (true) ShowUserMenu();
    }

    static void ShowAuthMenu()
    {
        Console.Clear(); Console.WriteLine("=== ВИКТОРИНА ===\n1. Вход\n2. Регистрация\n3. Выход"); Console.Write("Выбор: ");
        switch (Console.ReadLine())
        { case "1": Login(); break; case "2": Register(); break; case "3": Environment.Exit(0); break; default: Wait("Неверно"); break; }
    }

    static void Login()
    {
        Console.Clear(); Console.Write("Логин: "); string login = Console.ReadLine() ?? ""; Console.Write("Пароль: "); string pwd = Console.ReadLine() ?? "";
        var u = LoadUsers().FirstOrDefault(u => u.Login == login && u.Password == pwd);
        if (u != null) { currentUser = u; Console.WriteLine($"\nДобро пожаловать, {login}!"); Wait(); } else Wait("Неверно");
    }

    static void Register()
    {
        Console.Clear(); Console.Write("Логин: "); string login = Console.ReadLine() ?? "";
        var users = LoadUsers();
        if (users.Any(u => u.Login == login)) { Wait("Логин есть"); return; }
        Console.Write("Пароль: "); string pwd = Console.ReadLine() ?? ""; Console.Write("Дата (ГГГГ-ММ-ДД): ");
        if (!DateOnly.TryParse(Console.ReadLine(), out DateOnly bd)) { Wait("Неверный формат"); return; }
        users.Add(new User { Login = login, Password = pwd, BirthDate = bd }); SaveUsers(users); Wait("Регистрация успешна!");
    }

    static void ShowUserMenu()
    {
        Console.Clear(); Console.WriteLine($"=== {currentUser!.Login} ===\n1. Новая викторина\n2. Мои результаты\n3. Топ-20\n4. Настройки" + (currentUser.Login == "admin" ? "\n5. Админ-панель" : "") + "\n6. Выход"); Console.Write("Выбор: ");
        switch (Console.ReadLine())
        {
            case "1": StartQuiz(); break;
            case "2": MyResults(); break;
            case "3": Top20(); break;
            case "4": Settings(); break;
            case "5": if (currentUser.Login == "admin") AdminPanel(); break;
            case "6": currentUser = null; break;
            default: Wait("Неверно"); break;
        }
    }

    static void AdminPanel()
    {
        while (true)
        {
            Console.Clear(); Console.WriteLine("=== АДМИН ===\n1. Создать викторину\n2. Добавить вопрос\n3. Удалить викторину\n4. Назад");
            Console.Write("Выбор: ");
            switch (Console.ReadLine())
            { case "1": CreateQuiz(); break; case "2": AddQuestion(); break; case "3": DeleteQuiz(); break; case "4": return; default: Wait("Неверно"); break; }
        }
    }

    static void CreateQuiz()
    {
        Console.Clear(); Console.Write("Название: "); string name = Console.ReadLine() ?? "";
        if (File.Exists(Path.Combine(QuizzesFolder, name + ".json"))) { Wait("Уже есть"); return; }
        var quiz = new Quiz { Name = name };
        Console.Write("Сколько вопросов? "); if (!int.TryParse(Console.ReadLine(), out int cnt) || cnt < 1) { Wait("Ошибка"); return; }
        for (int i = 0; i < cnt; i++)
        {
            Console.Clear(); Console.WriteLine($"Вопрос {i + 1}/{cnt}"); var q = new Question();
            Console.Write("Текст: "); q.Text = Console.ReadLine() ?? "";
            Console.Write("Кол-во вариантов: "); if (!int.TryParse(Console.ReadLine(), out int opt) || opt < 2) { i--; continue; }
            for (int j = 0; j < opt; j++) { Console.Write($"Вариант {j + 1}: "); q.Options.Add(Console.ReadLine() ?? ""); }
            Console.Write("Правильные (через запятую): "); var corr = new HashSet<int>();
            foreach (var n in (Console.ReadLine() ?? "").Split(',')) if (int.TryParse(n.Trim(), out int idx) && idx >= 1 && idx <= opt) corr.Add(idx - 1);
            q.CorrectAnswers = corr.Count == 0 ? new HashSet<int> { 0 } : corr;
            quiz.Questions.Add(q);
        }
        SaveQuiz(quiz); Wait($"Викторина '{name}' создана!");
    }

    static void AddQuestion()
    {
        var qz = LoadQuizzes(); if (qz.Count == 0) { Wait("Нет викторин"); return; }
        Console.Clear(); for (int i = 0; i < qz.Count; i++) Console.WriteLine($"{i + 1}. {qz[i].Name}");
        Console.Write("Выберите: "); if (!int.TryParse(Console.ReadLine(), out int c) || c < 1 || c > qz.Count) { Wait("Неверно"); return; }
        var quiz = qz[c - 1]; var q = new Question();
        Console.Write("Текст: "); q.Text = Console.ReadLine() ?? "";
        Console.Write("Кол-во вариантов: "); if (!int.TryParse(Console.ReadLine(), out int opt) || opt < 2) { Wait("Ошибка"); return; }
        for (int j = 0; j < opt; j++) { Console.Write($"Вариант {j + 1}: "); q.Options.Add(Console.ReadLine() ?? ""); }
        Console.Write("Правильные (через запятую): "); var corr = new HashSet<int>();
        foreach (var n in (Console.ReadLine() ?? "").Split(',')) if (int.TryParse(n.Trim(), out int idx) && idx >= 1 && idx <= opt) corr.Add(idx - 1);
        q.CorrectAnswers = corr.Count == 0 ? new HashSet<int> { 0 } : corr;
        quiz.Questions.Add(q); SaveQuiz(quiz); Wait("Вопрос добавлен!");
    }

    static void DeleteQuiz()
    {
        var qz = LoadQuizzes(); if (qz.Count == 0) { Wait("Нет викторин"); return; }
        Console.Clear(); for (int i = 0; i < qz.Count; i++) Console.WriteLine($"{i + 1}. {qz[i].Name}");
        Console.Write("Удалить какую? "); if (int.TryParse(Console.ReadLine(), out int c) && c >= 1 && c <= qz.Count)
        { File.Delete(Path.Combine(QuizzesFolder, qz[c - 1].Name + ".json")); Wait("Удалено"); }
        else Wait("Неверно");
    }

    static void StartQuiz()
    {
        var qz = LoadQuizzes(); if (qz.Count == 0) { Wait("Нет викторин"); return; }
        Console.Clear(); for (int i = 0; i < qz.Count; i++) Console.WriteLine($"{i + 1}. {qz[i].Name}");
        Console.WriteLine($"{qz.Count + 1}. СМЕШАННАЯ"); Console.Write("Выбор: ");
        if (!int.TryParse(Console.ReadLine(), out int c) || c < 1 || c > qz.Count + 1) { Wait("Неверно"); return; }

        List<Question> qlist; string qname;
        if (c == qz.Count + 1) { qname = "Смешанная"; var all = qz.SelectMany(x => x.Questions).ToList(); qlist = all.OrderBy(x => Guid.NewGuid()).Take(20).ToList(); }
        else { qname = qz[c - 1].Name; qlist = qz[c - 1].Questions.Take(20).ToList(); }
        if (qlist.Count == 0) { Wait("Нет вопросов"); return; }

        int score = 0;
        for (int i = 0; i < qlist.Count; i++)
        {
            var q = qlist[i]; Console.Clear(); Console.WriteLine($"Вопрос {i + 1}/{qlist.Count}\n{q.Text}\n");
            for (int j = 0; j < q.Options.Count; j++) Console.WriteLine($"{j + 1}. {q.Options[j]}");
            if (q.CorrectAnswers.Count > 1) Console.WriteLine($"\n(Нужно выбрать {q.CorrectAnswers.Count} ответа)");
            Console.Write("\nОтвет: "); var ans = (Console.ReadLine() ?? "").Split(',').Select(x => int.TryParse(x.Trim(), out int n) ? n - 1 : -1).Where(i => i >= 0).ToHashSet();
            if (ans.SetEquals(q.CorrectAnswers)) { score++; Console.WriteLine("\nПРАВИЛЬНО!"); } else { Console.Write("\nНЕПРАВИЛЬНО! Ответ: "); Console.WriteLine(string.Join(", ", q.CorrectAnswers.Select(i => q.Options[i]))); }
            if (i < qlist.Count - 1) { Console.WriteLine("\nEnter..."); Console.ReadLine(); }
        }

        var res = new QuizResult { Username = currentUser!.Login, QuizName = qname, Score = score, Total = qlist.Count, Date = DateTime.Now };
        SaveResult(res);
        var allRes = LoadResults().Where(r => r.QuizName == qname).OrderByDescending(r => r.Score).ThenBy(r => r.Date).ToList();
        int place = allRes.FindIndex(r => r.Username == currentUser.Login && r.Date == res.Date) + 1;
        Console.Clear(); Console.WriteLine($"РЕЗУЛЬТАТ: {score}/{qlist.Count}\nМесто: {place}"); Wait();
    }

    static void MyResults()
    {
        var res = LoadResults().Where(r => r.Username == currentUser!.Login).OrderByDescending(r => r.Date).ToList();
        Console.Clear(); Console.WriteLine("МОИ РЕЗУЛЬТАТЫ\n"); if (res.Count == 0) Console.WriteLine("Нет результатов");
        else foreach (var r in res) Console.WriteLine($"{r.Date:dd.MM.yyyy HH:mm} | {r.QuizName} | {r.Score}/{r.Total}");
        Wait();
    }

    static void Top20()
    {
        var qz = LoadQuizzes(); if (qz.Count == 0) { Wait("Нет викторин"); return; }
        Console.Clear(); for (int i = 0; i < qz.Count; i++) Console.WriteLine($"{i + 1}. {qz[i].Name}"); Console.Write("Выбор: ");
        if (!int.TryParse(Console.ReadLine(), out int c) || c < 1 || c > qz.Count) { Wait("Неверно"); return; }
        var quiz = qz[c - 1];
        var top = LoadResults().Where(r => r.QuizName == quiz.Name).GroupBy(r => r.Username).Select(g => new { g.Key, Best = g.Max(r => r.Score) }).OrderByDescending(x => x.Best).Take(20).ToList();
        Console.Clear(); Console.WriteLine($"ТОП-20: {quiz.Name}\n"); if (top.Count == 0) Console.WriteLine("Нет результатов");
        else for (int i = 0; i < top.Count; i++) Console.WriteLine($"{i + 1}. {top[i].Key} — {top[i].Best}/{quiz.Questions.Count}");
        Wait();
    }

    static void Settings()
    {
        Console.Clear(); Console.WriteLine("НАСТРОЙКИ\n1. Сменить пароль\n2. Сменить дату\n3. Назад"); Console.Write("Выбор: ");
        switch (Console.ReadLine())
        {
            case "1": Console.Write("Новый пароль: "); string np = Console.ReadLine() ?? ""; var u = LoadUsers(); u.First(x => x.Login == currentUser!.Login).Password = np; SaveUsers(u); Wait("Пароль изменён"); break;
            case "2": Console.Write("Новая дата (ГГГГ-ММ-ДД): "); if (DateOnly.TryParse(Console.ReadLine(), out DateOnly nd)) { var u2 = LoadUsers(); u2.First(x => x.Login == currentUser!.Login).BirthDate = nd; SaveUsers(u2); Wait("Дата изменена"); } else Wait("Ошибка"); break;
        }
    }

    static List<User> LoadUsers() => !File.Exists(UsersFile) ? new() : JsonSerializer.Deserialize<List<User>>(File.ReadAllText(UsersFile)) ?? new();
    static void SaveUsers(List<User> u) => File.WriteAllText(UsersFile, JsonSerializer.Serialize(u, new JsonSerializerOptions { WriteIndented = true }));
    static List<Quiz> LoadQuizzes() { var list = new List<Quiz>(); if (!Directory.Exists(QuizzesFolder)) return list; foreach (var f in Directory.GetFiles(QuizzesFolder, "*.json")) try { var q = JsonSerializer.Deserialize<Quiz>(File.ReadAllText(f)); if (q != null) list.Add(q); } catch { } return list; }
    static void SaveQuiz(Quiz q) => File.WriteAllText(Path.Combine(QuizzesFolder, q.Name + ".json"), JsonSerializer.Serialize(q, new JsonSerializerOptions { WriteIndented = true }));
    static List<QuizResult> LoadResults() { var list = new List<QuizResult>(); if (!Directory.Exists(ResultsFolder)) return list; foreach (var f in Directory.GetFiles(ResultsFolder, "*.json")) try { var r = JsonSerializer.Deserialize<QuizResult>(File.ReadAllText(f)); if (r != null) list.Add(r); } catch { } return list; }
    static void SaveResult(QuizResult r) => File.WriteAllText(Path.Combine(ResultsFolder, $"{r.Username}_{r.QuizName}_{r.Date:yyyyMMddHHmmss}.json"), JsonSerializer.Serialize(r, new JsonSerializerOptions { WriteIndented = true }));
    static void Wait(string msg = "") { if (!string.IsNullOrEmpty(msg)) Console.WriteLine($"\n{msg}"); Console.WriteLine("\nEnter..."); Console.ReadLine(); }
}
